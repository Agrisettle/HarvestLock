<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0b120f;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 90px;
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
  }
  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 20px;
    letter-spacing: 0.08em;
    color: #d4a937;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .tag::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #eec765;
    margin-right: 12px;
  }
  h1 {
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: 76px;
    line-height: 1.05;
    color: #f3f1e9;
    max-width: 950px;
    margin-bottom: 28px;
  }
  h1 em {
    font-style: italic;
    color: #eec765;
  }
  p {
    font-size: 28px;
    color: #c9c6ba;
    max-width: 820px;
    line-height: 1.4;
  }
  .brand {
    position: absolute;
    top: 90px;
    right: 90px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand img {
    width: 44px;
    height: 44px;
  }
  .brand span {
    font-family: "Fraunces", serif;
    font-weight: 600;
    font-size: 26px;
    color: #f3f1e9;
  }
</style>
