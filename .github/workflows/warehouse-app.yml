name: warehouse-app

on:
  push:
    branches: [main]
    paths:
      - "warehouse-app/**"
      - ".github/workflows/warehouse-app.yml"
  pull_request:
    paths:
      - "warehouse-app/**"
      - ".github/workflows/warehouse-app.yml"

# Explicit least-privilege token, not relying on the repo/org default
# (currently "read" too, checked directly -- but shouldn't depend on
# that staying true). Nothing here pushes, comments, or writes
# anything -- checkout, typecheck, lint, test, build all only need
# read access.
permissions:
  contents: read

jobs:
  build:
    name: Warehouse app / typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 (this app's vitest environment) hard-requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0 (its own package.json
          # engines field) -- Node 20 doesn't satisfy that at all, and
          # crashes before any test runs with "webidl.util.markAsUncloneable
          # is not a function" (jsdom's bundled undici calling a Node
          # internal webidl API that doesn't exist on 20). 24 matches
          # local dev and buyer-app/coop-pwa's identical workaround.
          node-version: 24
          cache: npm
          cache-dependency-path: warehouse-app/package-lock.json

      - name: npm ci
        run: npm ci

      # Fails the job on a high or critical advisory in anything npm ci just
      # installed (runtime and dev dependencies alike). Moderate and low
      # advisories do not fail the build. Kept inside this job so the
      # required check name is unchanged.
      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high


      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build

      - name: check bundle-size budget
        run: npm run check:bundle-size
