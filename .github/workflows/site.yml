name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub Actions (see coop-pwa.yml/
          # buyer-app.yml, which hit a hard jsdom-engines incompatibility
          # on it) -- bumped here too for consistency, even though this
          # job doesn't run jsdom-based tests itself.
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
