name: coop-pwa

on:
  push:
    branches: [main]
    paths:
      - "coop-pwa/**"
      - ".github/workflows/coop-pwa.yml"
  pull_request:
    paths:
      - "coop-pwa/**"
      - ".github/workflows/coop-pwa.yml"

jobs:
  build:
    name: typecheck + lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coop-pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (this app's vitest environment) hard-requires
          # ^22.22.2 || ^24.15.0 || >=26.0.0 (its own package.json
          # engines field) -- Node 20 doesn't satisfy that at all, and
          # crashes before any test runs with "webidl.util.markAsUncloneable
          # is not a function" (jsdom's bundled undici calling a Node
          # internal webidl API that doesn't exist on 20). 24 matches
          # local dev, where the whole suite has run clean all along.
          node-version: 24
          cache: npm
          cache-dependency-path: coop-pwa/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npx tsc -b --noEmit

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build
        run: npm run build
