name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"

# Live-testnet integration tests (api/test/stellar.test.ts, the ones that
# actually deploy/build/sign/submit against real Stellar testnet) still do
# NOT run here. They need a funded DEPLOYER_SECRET_KEY as a repo secret,
# and wiring a real key into a workflow that can be triggered by
# pull_request (including from forks) is a security-surface decision
# that hasn't been made yet — not an oversight; see
# api/README.md/api/HANDOFF.md and
# https://github.com/Agrisettle/HarvestLock/issues/10.
#
# What DOES run here now: server.test.ts and reputation.test.ts, the two
# test files that need a real Postgres (the same service container the
# migrate step below already stands up) but never touch Stellar/Soroban
# at all -- neither imports anything that requires DEPLOYER_SECRET_KEY or
# ESCROW_WASM_HASH, checked directly before wiring this in. This was
# previously a real coverage gap: a green badge with the actual test
# suite never running in CI at all, not even the parts that need no
# secret.

jobs:
  build:
    name: typecheck + build + migrate + test (network-free)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: harvestlock
          POSTGRES_DB: harvestlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:harvestlock@localhost:5432/harvestlock
      # Real, public testnet values -- not secrets. rpc.ts throws at
      # *module load* if STELLAR_RPC_URL is unset (fails the process at
      # boot, not per-request -- see its own doc comment), so server.ts
      # can't even be imported by server.test.ts without this set, even
      # though these two test files never actually call anything that
      # dials out to it.
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 is deprecated on GitHub Actions (see coop-pwa.yml/
          # buyer-app.yml, which hit a hard jsdom-engines incompatibility
          # on it) -- bumped here too for consistency, even though this
          # job doesn't run jsdom-based tests itself.
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: migrate (proves the schema is actually valid SQL)
        run: npm run migrate

      - name: test (server.test.ts + reputation.test.ts -- no Stellar network calls)
        run: npx vitest run test/server.test.ts test/reputation.test.ts
